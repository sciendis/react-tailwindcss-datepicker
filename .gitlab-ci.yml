image: node:22

stages:
    - validate
    - publish

variables:
    HUSKY: "0"
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
        - .npm/

validate-package:
    stage: validate
    script:
        - npm install --no-audit --no-fund
        - npm run format:check
        - npm run lint
        - npm run typecheck
        - npm test -- --runInBand --no-watchman
        - npm run build
        - npm pack --dry-run --ignore-scripts
    artifacts:
        paths:
            - dist/
        expire_in: 1 day

publish-package:
    stage: publish
    needs:
        - job: validate-package
          artifacts: true
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
    before_script:
        - PACKAGE_NAME="$(node -p "require('./package.json').name")"
        - PACKAGE_VERSION="$(node -p "require('./package.json').version")"
        - |
            if [ "$CI_COMMIT_TAG" != "v$PACKAGE_VERSION" ]; then
                echo "Release tag '$CI_COMMIT_TAG' does not match package version '$PACKAGE_VERSION' (expected 'v$PACKAGE_VERSION')."
                exit 1
            fi
        - npm config set @sciendis:registry "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/npm/"
        - npm config set --
          "//$CI_SERVER_HOST/api/v4/projects/$CI_PROJECT_ID/packages/npm/:_authToken"
          "$CI_JOB_TOKEN"
    script:
        - if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then echo
          "$PACKAGE_NAME@$PACKAGE_VERSION already exists in the GitLab Package Registry"; exit 1; fi
        - npm publish --ignore-scripts
